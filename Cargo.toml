[package]
name = "claude-history"
version = "0.1.81"
edition = "2024"
description = "Fuzzy-search Claude Code conversation history from the terminal."
readme = "README.md"
license = "MIT"
repository = "https://github.com/raine/claude-history"
homepage = "https://github.com/raine/claude-history"
keywords = ["claude", "claude-code", "fzf", "cli", "history"]
categories = ["command-line-utilities"]

[features]
release-dynamic-ort = ["ort/load-dynamic", "fastembed/ort-load-dynamic"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bincode = "1.3"
blake3 = "1.8"
colored = "3.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
thiserror = "2.0"
toml = "0.9"
home = "0.5"
rayon = "1.10"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["osc52"] }
textwrap = "0.16"
pulldown-cmark = "0.13"
unicode-width = "0.2"
arboard = "3.4"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
terminal-light = "1.0"
tempfile = "3"
indicatif = "0.17"
fastembed = { version = "6.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ort = { version = "=2.0.0-rc.13", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
memmap2 = "0.9"
fst = "0.4"
memchr = "2"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
zstd = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
